name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const version = require("./manifest.json").version; if (process.env.RELEASE_TAG !== version) { console.error(`Tag ${process.env.RELEASE_TAG} does not match manifest version ${version}`); process.exit(1); }'

      - name: Build and verify plugin
        run: |
          node scripts/build.js
          git diff --exit-code -- main.js

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title="Wheelhouse Task View v$RELEASE_TAG" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css
