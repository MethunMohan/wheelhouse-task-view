name: Release Obsidian plugin

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const m = require("./manifest.json"); const versions = require("./versions.json"); if (!/^\d+\.\d+\.\d+$/.test(m.version) || process.env.RELEASE_TAG !== m.version) { console.error(`Tag ${process.env.RELEASE_TAG} does not match x.y.z manifest version ${m.version}`); process.exit(1); } if (versions[m.version] !== m.minAppVersion) { console.error(`versions.json must map ${m.version} to ${m.minAppVersion}`); process.exit(1); }'

      - name: Build and verify plugin
        run: |
          node scripts/build.js
          git diff --exit-code -- main.js

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.js "$RELEASE_TAG" > release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title="Wheelhouse Task View v$RELEASE_TAG" \
            --draft \
            --notes-file release-notes.md \
            main.js manifest.json styles.css
